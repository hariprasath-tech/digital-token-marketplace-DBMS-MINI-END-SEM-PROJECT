server.port=8080

# Database Configuration (MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/digital_token_marketplace?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=hari
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Properties as mentioned in specification
db.url=jdbc:mysql://localhost:3306/digital_token_marketplace
db.username=root
db.password=hari

# Logging Configuration
logging.level.com.sece.tokenmarketplace=INFO
logging.level.org.springframework.jdbc.core=DEBUG
